name: Bootstrap production host

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type BOOTSTRAP to install the isolated production stack
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    if: inputs.confirm == 'BOOTSTRAP'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    steps:
      - name: Check out pinned source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          ssh-keygen -lf "$HOME/.ssh/known_hosts"

      - name: Build fixed bootstrap bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/bootstrap"
          mkdir -p "$bundle/scripts" "$bundle/deploy"
          cp scripts/bootstrap-server.sh scripts/install-release.sh scripts/rollback.sh \
            scripts/deactivate-release.sh scripts/backup.sh scripts/restore-backup.sh \
            scripts/release-helper.sh scripts/reality-helper.sh scripts/reality-canary.sh \
            scripts/application-canary.sh "$bundle/scripts/"
          cp deploy/Caddyfile deploy/my-vpn.service deploy/my-vpn-backup.service \
            deploy/my-vpn-backup.timer deploy/xray.service deploy/my-vpn.sudoers \
            "$bundle/deploy/"
          ssh-keygen -y -f "$HOME/.ssh/deploy_key" > "$bundle/deploy-authorized-key.pub"
          ssh-keygen -lf "$bundle/deploy-authorized-key.pub"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 \
            --numeric-owner -C "$bundle" -czf "$RUNNER_TEMP/bootstrap.tar.gz" .

      - name: Install fixed root-owned deployment surface
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          BOOTSTRAP_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^([A-Za-z0-9.-]+|[0-9]{1,3}(\.[0-9]{1,3}){3})$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          [[ "$BOOTSTRAP_USER" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]]
          remote_dir="/tmp/my-vpn-bootstrap-${GITHUB_SHA}"
          ssh_args=(-i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=40 \
            -o ConnectTimeout=20 -p "$DEPLOY_PORT")
          cleanup() {
            ssh "${ssh_args[@]}" "$BOOTSTRAP_USER@$DEPLOY_HOST" "rm -rf '$remote_dir'" || true
          }
          trap cleanup EXIT
          ssh "${ssh_args[@]}" "$BOOTSTRAP_USER@$DEPLOY_HOST" "umask 077; mkdir '$remote_dir'"
          scp -i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -P "$DEPLOY_PORT" \
            "$RUNNER_TEMP/bootstrap.tar.gz" "$BOOTSTRAP_USER@$DEPLOY_HOST:$remote_dir/"
          ssh "${ssh_args[@]}" "$BOOTSTRAP_USER@$DEPLOY_HOST" \
            "tar -xzf '$remote_dir/bootstrap.tar.gz' -C '$remote_dir' && sudo bash '$remote_dir/scripts/bootstrap-server.sh' '$DEPLOY_PORT'"

      - name: Configure isolated VPN edge controller
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          BOOTSTRAP_USER: ${{ secrets.DEPLOY_USER }}
          EDGE_HOST: 217.147.13.228
          EDGE_PORT: "22"
          EDGE_HOST_FINGERPRINT: SHA256:QQQHyS6/uy4zs4m3EmbltV70eFVdPQFJwY5g8lAUEtU
        run: |
          set -euo pipefail
          edge_known_hosts="$RUNNER_TEMP/edge-known-hosts"
          edge_controller_env="$RUNNER_TEMP/edge-controller.env"
          ssh-keyscan -T 15 -p "$EDGE_PORT" -t ed25519 "$EDGE_HOST" > "$edge_known_hosts" 2>/dev/null
          actual_fingerprint="$(ssh-keygen -lf "$edge_known_hosts" -E sha256 | awk '{print $2}')"
          [[ "$actual_fingerprint" == "$EDGE_HOST_FINGERPRINT" ]]
          printf 'EDGE_HOST=%s\nEDGE_PORT=%s\nEDGE_USER=my-vpn-deploy\n' \
            "$EDGE_HOST" "$EDGE_PORT" > "$edge_controller_env"
          chmod 0600 "$edge_known_hosts" "$edge_controller_env"
          remote_dir="/tmp/my-vpn-edge-controller-${GITHUB_SHA}"
          ssh_args=(-i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=40 \
            -o ConnectTimeout=20 -p "$DEPLOY_PORT")
          cleanup() {
            ssh "${ssh_args[@]}" "$BOOTSTRAP_USER@$DEPLOY_HOST" "rm -rf '$remote_dir'" || true
          }
          trap cleanup EXIT
          ssh "${ssh_args[@]}" "$BOOTSTRAP_USER@$DEPLOY_HOST" "umask 077; mkdir '$remote_dir'"
          scp -i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -P "$DEPLOY_PORT" \
            "$HOME/.ssh/deploy_key" "$edge_known_hosts" "$edge_controller_env" \
            "$BOOTSTRAP_USER@$DEPLOY_HOST:$remote_dir/"
          ssh "${ssh_args[@]}" "$BOOTSTRAP_USER@$DEPLOY_HOST" \
            "sudo install -m 0600 -o root -g root '$remote_dir/deploy_key' /etc/my-vpn/edge-deploy-key && \
             sudo install -m 0600 -o root -g root '$remote_dir/edge-known-hosts' /etc/my-vpn/edge-known-hosts && \
             sudo install -m 0600 -o root -g root '$remote_dir/edge-controller.env' /etc/my-vpn/edge-controller.env"

      - name: Verify control-plane provisioning through edge
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          BOOTSTRAP_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh_args=(-i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -p "$DEPLOY_PORT")
          device_id="$(openssl rand -hex 16)"
          invoke_helper() {
            local action="$1" request="$2" encoded
            encoded="$(printf '%s' "$request" | base64 -w 0)"
            ssh "${ssh_args[@]}" "$BOOTSTRAP_USER@$DEPLOY_HOST" \
              "printf '%s' '$encoded' | base64 -d | sudo /usr/local/libexec/my-vpn/reality-helper '$action'"
          }
          cleanup() {
            request="$(jq -cn --arg credential "vless-reality:$device_id" '{version:1,credential_ref:$credential}')"
            invoke_helper revoke "$request" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          request="$(jq -cn --arg device_id "$device_id" \
            '{version:1,device_id:$device_id,relative_name:"Edge canary",device_name:"GitHub Actions",platform:"linux"}')"
          provisioned="$(invoke_helper provision "$request")"
          jq -e --arg device_id "$device_id" \
            '.version == 1 and .state == "active" and .config_path == ("/api/v1/devices/" + $device_id + "/config")' \
            <<<"$provisioned" >/dev/null
          request="$(jq -cn --arg credential "vless-reality:$device_id" '{version:1,credential_ref:$credential}')"
          configured="$(invoke_helper config "$request")"
          jq -e '.version == 1 and (.vless_uri | startswith("vless://") and contains("@217.147.13.228:443?") and contains("security=reality"))' \
            <<<"$configured" >/dev/null
          cleanup
          trap - EXIT
          echo 'Control plane provisioned and revoked a temporary edge device.'

      - name: Verify dedicated deployment login
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -p "$DEPLOY_PORT" \
            "my-vpn-deploy@$DEPLOY_HOST" "sudo /usr/local/sbin/my-vpn-release preflight"

      - name: Remove temporary SSH material
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts" "$RUNNER_TEMP/edge-known-hosts" "$RUNNER_TEMP/edge-controller.env"
