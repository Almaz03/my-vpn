name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            printf 'Go files require gofmt:\n%s\n' "$unformatted" >&2
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race -count=1 ./...

      - name: Build
        run: go build -trimpath -o /tmp/my-vpn ./cmd/my-vpn

      - name: Check frontend JavaScript and required files
        shell: bash
        run: |
          set -euo pipefail
          test -s web/index.html
          python3 - <<'PY'
          import ipaddress, json
          with open("web/ru-direct.json", encoding="utf-8") as source:
              routes = json.load(source)
          assert 1 <= len(routes) <= 250
          assert all(item.get("hostname") and item.get("ips") for item in routes)
          assert all(ipaddress.ip_address(ip).version == 4 for item in routes for ip in item["ips"])
          PY
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find web -type f -name '*.js' -print0)

      - name: Reject obvious committed secrets
        shell: bash
        run: |
          set -euo pipefail
          pattern='-----BEGIN ([A-Z0-9 ]+ )?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9]{30,}|[0-9]{8,12}:[A-Za-z0-9_-]{30,}'
          if git grep -I -n -E -e "$pattern" -- .; then
            echo 'Possible credential material is committed.' >&2
            exit 1
          fi
