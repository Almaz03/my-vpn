name: Build and deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after build (still requires enabled production repository variables)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify and test
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race -count=1 ./...
          go build -trimpath -o /tmp/my-vpn ./cmd/my-vpn
          test -s web/index.html
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find web -type f -name '*.js' -print0)
          pattern='-----BEGIN ([A-Z0-9 ]+ )?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9]{30,}|[0-9]{8,12}:[A-Za-z0-9_-]{30,}'
          if git grep -I -n -E -e "$pattern" -- .; then
            echo 'Possible credential material is committed.' >&2
            exit 1
          fi

      - name: Build versioned release
        shell: bash
        env:
          VERSION: ${{ github.sha }}
        run: scripts/build-release.sh "$VERSION" "$RUNNER_TEMP/release"

      - name: Upload immutable release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: my-vpn-${{ github.sha }}
          path: |
            ${{ runner.temp }}/release/my-vpn-${{ github.sha }}.tar.gz
            ${{ runner.temp }}/release/my-vpn-${{ github.sha }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  deploy:
    needs: build
    if: >-
      vars.ENABLE_PRODUCTION_DEPLOY == 'true' &&
      vars.PROVISIONER_MODE != '' &&
      vars.PROVISIONER_MODE != 'noop' &&
      (github.event_name == 'push' || inputs.deploy)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - name: Check out deployment scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download verified build output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: my-vpn-${{ github.sha }}
          path: ${{ runner.temp }}/release

      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          ssh-keygen -lf "$HOME/.ssh/known_hosts"

      - name: Prepare runtime configuration
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_IDS: ${{ secrets.TELEGRAM_ADMIN_IDS }}
          PROVISIONER_MODE: ${{ vars.PROVISIONER_MODE }}
        run: |
          set -euo pipefail
          [[ "$TELEGRAM_BOT_TOKEN" =~ ^[0-9]+:[A-Za-z0-9_-]+$ ]]
          [[ "$TELEGRAM_ADMIN_IDS" =~ ^[1-9][0-9]*(,[1-9][0-9]*)*$ ]]
          [[ "$PROVISIONER_MODE" =~ ^[a-z0-9_-]+$ ]]
          [[ "$PROVISIONER_MODE" != "noop" ]]
          umask 077
          {
            printf 'APP_LISTEN=127.0.0.1:8080\n'
            printf 'APP_DB_PATH=/var/lib/my-vpn/my-vpn.db\n'
            printf 'PUBLIC_BASE_URL=https://vpn.akalmaz.tech\n'
            printf 'WEB_ROOT=/opt/my-vpn/current/web\n'
            printf 'PROVISIONER_MODE=%s\n' "$PROVISIONER_MODE"
            printf 'TELEGRAM_BOT_TOKEN=%s\n' "$TELEGRAM_BOT_TOKEN"
            printf 'TELEGRAM_ADMIN_IDS=%s\n' "$TELEGRAM_ADMIN_IDS"
          } > "$RUNNER_TEMP/runtime.env"

      - name: Upload and atomically install release
        id: install
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          VERSION: ${{ github.sha }}
        run: |
          set -euo pipefail
          remote_dir="/tmp/my-vpn-$VERSION"
          remote_created=false
          ssh_args=(
            -i "$HOME/.ssh/deploy_key"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -p "$DEPLOY_PORT"
          )
          cleanup_remote() {
            if [[ "$remote_created" == true ]]; then
              ssh "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "rm -rf '$remote_dir'" || true
            fi
          }
          trap cleanup_remote EXIT
          previous_version="$(ssh "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "if test -L /opt/my-vpn/current; then basename \"\$(readlink -f /opt/my-vpn/current)\"; fi")"
          if [[ -n "$previous_version" && ! "$previous_version" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Existing release link does not contain a full commit SHA." >&2
            exit 1
          fi
          printf 'previous_version=%s\n' "$previous_version" >> "$GITHUB_OUTPUT"
          ssh "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "command -v caddy >/dev/null && command -v sqlite3 >/dev/null && command -v openssl >/dev/null && command -v curl >/dev/null && systemctl is-active --quiet caddy.service && grep -Eq '^[[:space:]]*import[[:space:]]+conf\\.d/\\*' /etc/caddy/Caddyfile"
          ssh "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "umask 077; mkdir -p '$remote_dir'"
          remote_created=true
          ssh "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo systemd-run --quiet --collect --on-active=30m /usr/bin/rm -rf '$remote_dir'"
          scp -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -P "$DEPLOY_PORT" \
            "$RUNNER_TEMP/release/my-vpn-$VERSION.tar.gz" \
            "$RUNNER_TEMP/release/my-vpn-$VERSION.tar.gz.sha256" \
            "$RUNNER_TEMP/runtime.env" \
            scripts/install-release.sh \
            scripts/rollback.sh \
            scripts/deactivate-release.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:$remote_dir/"
          if ! ssh "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo bash '$remote_dir/install-release.sh' '$VERSION' '$remote_dir/my-vpn-$VERSION.tar.gz' '$remote_dir/my-vpn-$VERSION.tar.gz.sha256' '$remote_dir/runtime.env'"; then
            if [[ -n "$previous_version" ]]; then
              ssh "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
                "if test -x /usr/local/libexec/my-vpn/rollback.sh; then sudo /usr/local/libexec/my-vpn/rollback.sh '$previous_version'; fi"
            else
              ssh "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
                "sudo bash '$remote_dir/deactivate-release.sh' '$VERSION'"
            fi
            exit 1
          fi

      - name: Public smoke test
        id: public_smoke
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 2 \
            --max-time 10 https://vpn.akalmaz.tech/healthz >/dev/null

      - name: Roll back after failed public smoke test
        if: steps.public_smoke.outcome == 'failure' && steps.install.outputs.previous_version != ''
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          PREVIOUS_VERSION: ${{ steps.install.outputs.previous_version }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo /usr/local/libexec/my-vpn/rollback.sh '$PREVIOUS_VERSION'"

      - name: Stop a failed first release
        if: steps.public_smoke.outcome == 'failure' && steps.install.outputs.previous_version == ''
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo /usr/local/libexec/my-vpn/deactivate-release.sh '${{ github.sha }}'"

      - name: Fail deployment after smoke-test rollback
        if: steps.public_smoke.outcome == 'failure'
        shell: bash
        run: |
          echo 'Public smoke test failed; the previous release was restored when available.' >&2
          exit 1

      - name: Remove temporary SSH material
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts" "$RUNNER_TEMP/runtime.env"
